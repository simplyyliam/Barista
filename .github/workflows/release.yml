# Builds the Barista installer when an app tag (v0.1.0, ...) is pushed by `pnpm release`,
# signs the auto-update, and attaches everything plus latest.json to a DRAFT release.
# Publishing the draft (by hand, after testing) is what makes installed copies update.
# SDK tags (sdk-v*) are handled by sdk-release.yml, not here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the draft release and upload files

jobs:
  # Creates the draft release ONCE, before the build, so a retried run reuses it
  # instead of failing on "release already exists" (lesson from Blocksy v0.1.1).
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo "body<<BARISTA_NOTES"
            node scripts/changelog-section.mjs CHANGELOG.md "${GITHUB_REF_NAME}"
            echo "BARISTA_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release (or reuse it when a run is retried)
        id: release
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "")
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            const existing = releases.find((r) => r.tag_name === tag)
            if (existing) return existing.id
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Barista ${tag}`,
              body: process.env.BODY,
              draft: true,
              prerelease: false,
            })
            return data.id

  build:
    needs: create-release
    runs-on: windows-latest # Windows only: no macOS or Linux builds

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/bar/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed apps trust it (see scripts/updater-keygen.mjs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/bar
          tauriScript: pnpm tauri
          # Upload into the draft made by create-release (never create one here).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true # latest.json: what installed apps check
