# Builds the Barista installer when an app tag (v0.1.0, ...) is pushed by `pnpm release`,
# signs the auto-update, and attaches everything plus latest.json to a DRAFT release.
# Publishing the draft (by hand, after testing) is what makes installed copies update.
# SDK tags (sdk-v*) are handled by sdk-release.yml, not here.
# The installers and latest.json go to the PUBLIC releases repo (ADR 0038) (RELEASES_REPO below). Installed apps and the Download button read from there.
# Needs these repo secrets: RELEASES_TOKEN (fine-grained token, contents:write on the releases repo only),
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (pnpm updater:keygen prints them).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # the releases repo is written with RELEASES_TOKEN, not this token

env:
  RELEASES_OWNER: simplyyliam
  RELEASES_REPO: barista-releases

jobs:
  # Creates the draft release ONCE, before the build, so a retried run reuses it
  # instead of failing on "release already exists" (lesson from Blocksy v0.1.1).
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo "body<<BARISTA_NOTES"
            node scripts/changelog-section.mjs CHANGELOG.md "${GITHUB_REF_NAME}"
            echo "BARISTA_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release (or reuse it when a run is retried)
        id: release
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.notes.outputs.body }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const tag = context.ref.replace("refs/tags/", "")
            const target = { owner: process.env.RELEASES_OWNER, repo: process.env.RELEASES_REPO }
            const releases = await github.paginate(github.rest.repos.listReleases, target)
            const existing = releases.find((r) => r.tag_name === tag)
            if (existing) return existing.id
            const { data } = await github.rest.repos.createRelease({
              ...target,
              tag_name: tag,
              name: `Barista ${tag}`,
              body: process.env.BODY,
              draft: true,
              prerelease: false,
            })
            return data.id

  build:
    needs: create-release
    runs-on: windows-latest # Windows only: no macOS or Linux builds

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the update so installed apps trust it (see scripts/updater-keygen.mjs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/bar
          tauriScript: pnpm tauri
          # Upload into the draft made by create-release (never create one here).
          owner: ${{ env.RELEASES_OWNER }}
          repo: ${{ env.RELEASES_REPO }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Code signing (SmartScreen) is not set up yet. Later: add a signCommand under
          # bundle.windows in tauri.conf.json (Azure Trusted Signing) and its secrets above.
          includeUpdaterJson: true # latest.json: what installed apps check
