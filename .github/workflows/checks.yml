name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest # Barista is Windows-only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target # one Cargo workspace at the repo root

      - run: pnpm install --frozen-lockfile

      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      # Regenerates bindings.ts (tauri-specta) and protocol.ts (crates/protocol).
      - run: pnpm gen

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The SDK must pack for npm: catches a broken "files", "exports" or missing build output.
      - run: pnpm --filter @barista/sdk build
      - run: pnpm publish --dry-run --no-git-checks
        working-directory: packages/sdk

      # The website must build as a static export (apps/web/out/).
      - run: pnpm web:build

      # Fails if pnpm gen or cargo test changed generated files: they were stale.
      - run: git diff --exit-code
