# One Cargo workspace for the whole repo: a single `cargo test` covers the bar and the
# protocol crate, and both share one target/ folder.
[workspace]
resolver = "2"
members = ["apps/bar/src-tauri", "crates/protocol", "examples/win-helper"]

# Smaller and faster installer builds. `unwind` stays: the panic hook must run to give the
# screen space back (controller.rs), which `abort` would skip.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
