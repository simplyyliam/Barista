[package]
name = "barista"
version = "0.4.1"
description = "A macOS-style menu bar for Windows"
authors = ["Liam Matthews"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "barista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri-specta turns the Tauri commands into src/shared/bindings.ts. The three specta crates
# are pinned exactly because specta 2 is a release candidate (docs/decisions/0003).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde_json = "1"
# The messages shared with the SDK (crates/protocol is our own crate).
barista-protocol = { path = "../../../crates/protocol" }
# Async runtime for the pipe server. Tauri already runs on tokio, so this adds no second copy.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
# Decodes icon data URLs so their size and file type can be checked.
base64 = "0.23"
# Reads the toast XML (title, images, buttons) from Windows' notification database.
roxmltree = "0.21.2"

# Win32 calls (AppBar, monitors, window styles). Same version Tauri already uses, so Cargo
# builds only one copy. Each feature is one Win32 header group; add one only when needed.
# #[implement] (the audio callbacks) expands to code that names this crate. Same version as `windows`.
[target.'cfg(windows)'.dependencies]
# Opens Windows' notification database read-only (ADR 0018). SQLite is built in (bundled).
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows-core = "0.62"
# The WinRT list types (IIterable, IMapView) that the device watcher needs. Already in the tree through `windows`.
windows-collections = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel",
  "Devices_Enumeration",
  "Devices_Radios",
  "Foundation",
  "Networking_Connectivity",
  "Networking_NetworkOperators",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "System",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Power",
  "Win32_System_Time",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",

  "Win32_Storage_FileSystem",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
