[package]
name = "barista"
version = "0.0.0"
description = "A macOS-style menu bar for Windows"
authors = ["Liam Matthews"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "barista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri-specta turns the Tauri commands into src/shared/bindings.ts. The three specta crates
# are pinned exactly because specta 2 is a release candidate (docs/decisions/0003).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde_json = "1"

# Win32 calls (AppBar, monitors, window styles). Same version Tauri already uses, so Cargo
# builds only one copy. Each feature is one Win32 header group; add one only when needed.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
