# Every folder matched here is a workspace package: pnpm links them together,
# so `@barista/sdk` resolves to packages/sdk instead of the npm registry.
packages:
  - apps/*
  - packages/*
  - examples/*
verifyDepsBeforeRun: warn
# pnpm 10 blocks dependency install scripts unless listed. esbuild ships its
# binary as a separate package, so its install script isn't needed.
allowBuilds:
  esbuild: false
  # Electron downloads its binary in the install script. Dev dependency of the Electron examples only.
  electron: true
