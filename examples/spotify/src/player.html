<!doctype html>
<meta charset="utf-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
/>
<title>Spotify</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    font: 14px system-ui, sans-serif;
    color: #f2f2f2;
    background: #181818;
    user-select: none;
  }
  main {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    box-sizing: border-box;
    padding: 20px;
  }
  .art {
    flex: 1;
    margin-bottom: 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1db954, #14532d);
    display: grid;
    place-items: center;
    font-size: 64px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  p {
    margin: 4px 0 0;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    font: inherit;
    color: inherit;
    background: #2a2a2a;
    cursor: pointer;
  }
  button:hover {
    background: #3a3a3a;
  }
  button:focus-visible {
    outline: 2px solid #1db954;
  }
  button.main {
    background: #1db954;
    color: #04210e;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
</style>
<main>
  <div class="art" aria-hidden="true">♪</div>
  <div>
    <h1 id="title">Spotify</h1>
    <p id="subtitle"></p>
  </div>
  <div class="controls">
    <button id="previous" aria-label="Previous track">⏮</button>
    <button id="toggle" class="main" aria-label="Play or pause">⏯</button>
    <button id="next" aria-label="Next track">⏭</button>
    <button id="connect" class="main" hidden>Connect Spotify</button>
  </div>
</main>
<script src="player.js"></script>
